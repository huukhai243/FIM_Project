{% extends 'base.html' %}
{% block title %}Đăng nhập · FIM{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:40px auto">
  <h1>Đăng nhập</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p><input type="password" name="password" placeholder="Mật khẩu" autofocus required style="width:100%"></p>
    <button class="primary" style="width:100%">Đăng nhập</button>
  </form>
</div>
{% endblock %}
